# Minimal conda environment for ArDu. From the repository root:
#   conda env create -f environment.yml && conda activate ardu
name: ardu
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pysam>=0.22
  - numpy>=1.26
  - pandas>=2.0
  - matplotlib>=3.8
  - seaborn>=0.13
  - ruptures>=1.1
  - tqdm>=4.66
  - pyahocorasick>=2.0
  - scikit-learn>=1.4
  - blast            # only for ardu softclips / junctions --blast
  - mafft            # only for ardu junctions --junction --plot-evidence (junction read alignment)
  - pytest           # only to run the tests
  - pip
  - pip:
      - -e .
